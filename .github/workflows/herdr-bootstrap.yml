name: Herdr bootstrap

on:
  pull_request:
    paths:
      - "install.sh"
      - "Makefile"
      - "README.md"
      - "stow/**"
      - "scripts/check-herdr-bootstrap.py"
      - "tests/test_herdr_bootstrap.py"
      - "herdr-term"
      - ".github/workflows/herdr-bootstrap.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herdr-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pinned submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4

      - name: Install pinned npm without lifecycle scripts
        run: npm install --global npm@10.9.9 --ignore-scripts --no-audit --no-fund

      - name: Test setup and development-link safety in disposable homes
        run: make herdr-test
