name: Herdr bootstrap

on:
  pull_request:
    paths:
      - "install.sh"
      - "Makefile"
      - "README.md"
      - "stow/**"
      - "tests/test_herdr_*.py"
      - "herdr-term"
      - ".gitmodules"
      - ".github/workflows/herdr-bootstrap.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herdr-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Test setup and development-link safety in disposable homes
        run: make herdr-test
