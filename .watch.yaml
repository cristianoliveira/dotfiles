## Funzzy events file
# more details see: https://github.com/cristianoliveira/funzzy
#
# Workflow:
#
# First start by watching the changes in nix with the watcher
# ```bahs
# fzz -t nix
# ```
# Proceed to make the changes in the .dotfiles
on:
  socket: .pi/fzz.sock

jobs:
  - name: validate agents links
    run: python3 scripts/validate_links.py .
    change:
      - '**/AGENTS.md'
      - 'scripts/validate_links.py'

  - name: validate agents landmarks
    run: python3 scripts/validate_landmarks.py .
    change:
      - '**/AGENTS.md'
      - 'scripts/validate_landmarks.py'

  - name: validate sway
    run:
      - |
        if [ "$(uname)" = "Linux" ]; then
          nix/nixos/sway/validate.sh
        fi
    change: 'nix/nixos/sway/**'

  # Usage: `fzz -t nix`
  - name: watch nix configs
    run: 'SKIP_COMMIT=1 nix/rebuild.sh'
    change:
      - 'nix/**/*.nix'
      - 'nix/osx/aerospace/*.applescript'
    # run_on_init: true

  - name: test Brave tab gestures
    run: python3 -m unittest discover -s nix/osx/aerospace/tests -v
    change:
      - 'nix/osx/aerospace/*.applescript'
      - 'nix/osx/aerospace/tests/**/*.py'
    ignore:
      - '**/__pycache__'
      - '**/__pycache__/**'

  - name: check nvim
    run: make nvim
    change: 'nvim/**'

  - name: test herdr bootstrap
    run: make herdr-bootstrap-unit
    change:
      - 'nix/shared/herdr/**/*.json'
      - 'stow/herdr/**'
      - 'tests/test_herdr_*.py'
    ignore:
      - '**/__pycache__'
      - '**/__pycache__/**'

  - name: reload tmux
    run: tmux/reload.sh
    change: 'tmux/**'

  - name: reload stow
    run:
      - make check-symlinks
      - make stow
    change: 'stow/**'
    ignore:
      - '**/__pycache__'
      - '**/__pycache__/**'

  - name: adds to git
    # run_on_init: true
    run:
      - |
        git_bin=/run/current-system/sw/bin/git
        [ -x "$git_bin" ] || git_bin=/usr/bin/git
        path="${FZZ_TRIGGER_RELATIVE_PATH:-}"
        if [ -n "$path" ] && [ "$path" != '.fzz/git-task' ]; then
          if "$git_bin" check-ignore --quiet -- "$path"; then
            exit 0
          else
            ignore_status=$?
            [ "$ignore_status" -eq 1 ] || exit "$ignore_status"
          fi
          "$git_bin" add -- "$path" || exit "$?"
        fi
        "$git_bin" add -p
    change:
      - .fzz/git-task # touch .fzz/git-task
      - '**/*' ## FIXME fzz issue with non strings
    ignore:
      - .direnv
      - '.git/**/*'
      # Pi responder state must not trigger staging or failure-notification loops.
      - '.pi/**'
      # Python imports create Git-ignored bytecode, not source changes.
      - '**/__pycache__'
      - '**/__pycache__/**'
      - result

  - name: test git sync
    run: python3 -m unittest discover -s git/tests -v
    change:
      - 'git/sync-upstream.sh'
      - 'git/tests/**/*.py'

  # Automatic synchronization must never rewrite commits or leave merge conflicts.
  - name: sync upstream after commit
    run: bash git/sync-upstream.sh
    change:
      - ".git/COMMIT_EDITMSG"
