## Funzzy events file
# more details see: https://github.com/cristianoliveira/funzzy
#
# Workflow:
#
# First start by watching the changes in nix with the watcher
# ```bahs
# fzz -t nix
# ```
# Proceed to make the changes in the .dotfiles
on:
  socket: .pi/fzz.sock

jobs:
  - name: validate agents links
    run: python3 scripts/validate_links.py .
    change:
      - '**/AGENTS.md'
      - 'scripts/validate_links.py'

  - name: validate agents landmarks
    run: python3 scripts/validate_landmarks.py .
    change:
      - '**/AGENTS.md'
      - 'scripts/validate_landmarks.py'

  - name: validate sway
    #AI can Check if is Linux
    run: ' nix/nixos/sway/validate.sh'
    change: 'nix/nixos/sway/**'

  # Usage: `fzz -t nix`
  - name: watch nix configs
    run:
      # FIXME it fails on osx
      # - nix flake check nix --no-build
      - |
        if [ "$(uname)" = "Linux" ]; then
          SKIP_COMMIT=1 nix/rebuild.sh
        fi
    change:
      - 'nix/**/*.nix'
    # run_on_init: true

  - name: check nvim
    run: make nvim
    change: 'nvim/**'

  - name: reload tmux
    run: tmux/reload.sh
    change: 'tmux/**'

  - name: reload stow
    run:
      - make check-symlinks
      - make stow
    change: 'stow/**'

  - name: adds to git
    # run_on_init: true
    run:
      - git add {{relative_filepath}}
      - git add -p
    change:
      - .fzz/git-task # touch .fzz/git-task
      - '**/*' ## FIXME fzz issue with non strings
    ignore:
      - .direnv
      - '.git/**/*'
      - result

  - name: after commit attempt to rebase
    run:
      - git fetch --all
      - git rebase origin/$MAIN_BRANCH
    change:
      - ".git/COMMIT_EDITMSG"
